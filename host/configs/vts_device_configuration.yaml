# The information defined in this config is consistent across all devices of a type.

deviceConfig:
    cpe1:
        platform:   "vDevice"
        model:      "VTV"
        soc_vendor: "intel"
        target_directory: "/tmp/"
        prompt: "~#" # Prompt string on console
        wait_time: 240 # Configurable timeout value to limit the total duration of individual tests
        test:
            profile: "../../profiles/hfp-thermalsensor-vcomponent.yaml" # HFP profile used to meet platform requirements
            thermalsensor_controller_port: 8080 # Port where the vcomponent control plane is listening
