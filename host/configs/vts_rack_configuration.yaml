# This config file creates your environment, defaults are setup internally unless
# otherwise overridden. You will need at least 1 rack and 1 slot to operate.

# Data that is global to all tests.
globalConfig:
    includes:
        deviceConfig: "vts_device_configuration.yaml"
    local:
        log:
            directory: "./logs"
            delimiter: "/"

# Define racks, their slots and the devices in them.
rackConfig:
    rack1:
        name: "rack1"
        description: "thermal sensor test rack"
        slot1:
            name: "slot1"
            devices:
                - dut:
                    ip: ""
                    description: "VTV"
                    platform: "vDevice"
                    consoles:
                        - default:
                            type: "ssh"
                            port: 5522
                            username: ""
                            ip: ""      # IP address of the target device
                            password: ""
                            prompt: "~#"
                        - ssh_hal_test_0:
                            type: "ssh"
                            port: 5522
                            username: ""
                            ip: ""      # IP address of the target device
                            password: ""
                            prompt: "~#"
                        - ssh_hal_test_1:
                            type: "ssh"
                            port: 5522
                            username: ""
                            ip: ""      # IP address of the target device (vcomponent session)
                            password: ""
                            prompt: "~#"
                    thermalSensorController:
                        type: virtual-thermalsensor-client
                        vendor: "vComponent"
                        address: "" # IP address of the target device
                        username: ""         # Login username
                        password: ''         # Login password
                        port: 5522
                        control_port: 8080
                    outbound:
                        workspaceDirectory: "./logs/workspace"
                        download_url: "tftp://tftp-server.com/rack1/slot1/"
                        upload_url: "sftp://server-address/home/workspace/tftp/rack1/slot1/"
                        upload_url_base_dir: "sftp://server-address/home/workspace/tftp/rack1/slot1"
                        httpProxy:
