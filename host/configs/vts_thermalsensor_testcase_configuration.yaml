thermalsensor:
  description: "Thermal Sensor L1, L2 and L3 test setup"
  restart_required: False
  test_suites:
    ######################################
    # Entry to run all test cases
    ######################################
    #  - name: "VTS_L1_THERMALSENSOR"
    #    test_cases:
    #      - all
    #######################################
    # Entries to run individual test cases
    #######################################
    - name: "VTS_L1_THERMALSENSOR"
      test_cases:
        - "registerEventListener_pos"
        - "registerEventListener_neg"
        - "unregisterEventListener_pos"
        - "unregisterEventListener_neg"
        - "getCurrentThermalState_pos"
        - "getCurrentTemperatures_pos"
    - name: "VTS_L3_THERMALSENSOR"
      test_cases:
        - "ThermalStateTransition"
