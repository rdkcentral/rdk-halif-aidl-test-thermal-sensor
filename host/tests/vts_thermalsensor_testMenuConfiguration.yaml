# vts_thermalsensor_testMenuConfiguration.yaml
thermalsensor:
    description: "thermal sensor testing profile / menu system for UT"
    test:
        artifacts:
          - "../../build/bin/vts-thermalsensor.tar.gz"
        execute: "./run.sh"
        type: UT-C
        suites:
            0:
                name: "VTS_L1_THERMALSENSOR"
                tests:
                    - "RegisterUnregisterEventListener_Positive"
                    - "RegisterUnregisterEventListener_MultipleListener"
                    - "RegisterUnregisterEventListener_Negative"
                    - "GetCurrentThermalState_ValidStateAndHFPConsistency"
                    - "GetCurrentTemperatures_CountStructureAndProfileMatch"
            1:
                name: "VTS_L2_THERMALSENSOR"
                tests:
                    - "ThermalStateConsistency"
                    - "ListenerLifecycle"
                    - "MultipleListeners"
            2:
                name: "VTS_L3_THERMALSENSOR"
                tests:
                    - "ThermalExceedRecoveryLifecycle"
                    - "CriticalShutdownWithSuppression"
